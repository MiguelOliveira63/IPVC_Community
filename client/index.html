<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Realtime Starter</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <!-- Hambúrguer (mobile) -->
        <button class="icon-btn hamburger" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <!-- Perfil -->
        <div class="nav-profile" id="nav-profile">
            <span class="avatar" aria-hidden="true"></span>
            <div class="profile-meta">
                <span class="label">Conta</span>
                <button class="profile-button" id="profile-button" aria-label="Abrir conta">
                    <span id="user-name"> <!-- nome do utilizador --> </span>
                </button>
            </div>
        </div>

        <!-- Links de navegação (desktop) -->
        <div class="nav-links">
            <a href="#" class="nav-link">Eventos</a>
            <a href="#" class="nav-link">Calendario</a>
            <a href="#" class="nav-link">Perfil</a>
        </div>

        <!-- Busca + ações -->
        <div class="nav-search">
            <div class="search-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="search-ico"><path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input id="global-search" placeholder="Search event" aria-label="Pesquisar" />
            </div>
            <button class="icon-btn" aria-label="Filtros">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <button class="icon-btn has-dot" aria-label="Calendário">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="notif-dot" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <!-- Menu recolhível no mobile -->
    <div class="nav-drawer" id="nav-drawer">
        <a href="#" class="drawer-link">Início</a>
        <a href="#" class="drawer-link">Itens</a>
        <a href="#" class="drawer-link">Conta</a>
        <button id="logout-mobile" class="drawer-link danger">Sair</button>
    </div>
</nav>


<main>

    <!-- CATEGORIAS DE EVENTOS -->
    <section class="categories-section">
        <div class="categories-container" id="categories-container">
            <!-- Categorias aqui -->
        </div>
    </section>

    <section>
        <h5 class="title">Eventos Futuros</h5>
        <div class="events-scroll" id="events-futuros"></div>
        <!-- Todos os eventos futuros aqui -->
    </section>
    <section>
        <h5 class="title">Eventos IPVC</h5>
        <div class="events-scroll" id="events-ipvc"></div>
        <!-- Eventos no campus da universidade -->
    </section>
</main>

<script>
    // Toggle do menu mobile
    const navToggle = document.getElementById('nav-toggle');
    const navDrawer = document.getElementById('nav-drawer');

    if (navToggle && navDrawer) {
        navToggle.addEventListener('click', () => {
            const isOpen = navDrawer.classList.contains('open');
            if (isOpen) {
                navDrawer.classList.remove('open');
                navToggle.setAttribute('aria-expanded', 'false');
            } else {
                navDrawer.classList.add('open');
                navToggle.setAttribute('aria-expanded', 'true');
            }
        });
    }
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/session.js"></script>
<script src="/app.js"></script>
<script src="/categories.js"></script>
<script src="/eventos.js"></script>
</body>
</html>
