<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>IPVC Community - Registo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1700px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            min-height: 850px;
        }

        /* Painel ESQUERDO (AGORA o colorido/ilustração) */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #e47a38 0%, #e3bf9b 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 15px;
        }

        .illustration { width: 100%; max-width: 450px; margin-bottom: 3rem; }

        .task-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: absolute;
            bottom: 100px;
            left: 60px;
        }

        .task-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .task-info { color: #666; font-size: 0.9rem; margin-bottom: 12px; }
        .task-tag {
            display: inline-block; padding: 6px 16px; background: #f5f5f5; border: 1px solid #ddd;
            border-radius: 20px; font-size: 0.85rem;
        }

        .progress-circle { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; }

        .tagline { text-align: center; font-size: 1.3rem; color: #333; line-height: 1.6; }
        .tagline strong { font-weight: 700; color: #000; }

        .carousel-dots { display: flex; gap: 8px; justify-content: center; margin-top: 2rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #000; transition: all 0.3s; }
        .dot.active { width: 30px; border-radius: 5px; background: #000; }

        /* Painel DIREITO (AGORA o formulário) */
        .right-panel {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            background: transparent;
        }

        .right-panel h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; color: #000; }

        .subtitle { color: #666; font-size: 1rem; margin-bottom: 3rem; line-height: 1.6; }
        .subtitle strong { color: #000; }

        .form-group { margin-bottom: 1.5rem; }

        .form-group input {
            width: 100%; padding: 18px 24px; border: 2px solid #e5e5e5; border-radius: 5px;
            font-size: 1rem; outline: none; transition: all 0.3s ease; background: white;
        }
        .form-group input::placeholder { color: #999; }
        .form-group input:focus { border-color: #000; }

        .password-group { position: relative; }
        .password-group input { padding-right: 60px; }

        .toggle-password {
            position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #999; font-size: 1.2rem;
        }

        .login-btn {
            width: 100%; padding: 18px; background: #000; color: white; border: none; border-radius: 5px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-bottom: 2rem;
        }
        .login-btn:hover { background: #333; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .register-link { text-align: center; color: #666; font-size: 0.95rem; }
        .register-link a { color: #000; text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .register-link a:hover { color: #4f8cff; }

        /* Mobile */
        @media (max-width: 968px) {
            .container {
                flex-direction: column;
                margin: 16px auto 32px;   /* corrigido: faltava 'px' */
                min-height: unset;
            }
            .left-panel { display: none; }     /* tal como no login, escondemos o decorativo */
            .right-panel {
                justify-content: flex-start;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Painel de ilustração à ESQUERDA -->
    <div class="left-panel">
        <div class="illustration">
            <div class="task-card">
                <h3>Canva Design</h3>
                <p class="task-info">10 Task</p>
                <span class="task-tag">Design</span>
                <svg class="progress-circle" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="#e5e5e5" stroke-width="4"/>
                    <circle cx="25" cy="25" r="20" fill="none" stroke="#7fb883" stroke-width="4"
                            stroke-dasharray="100" stroke-dashoffset="16"
                            transform="rotate(-90 25 25)" stroke-linecap="round"/>
                    <text x="25" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#7fb883">84%</text>
                </svg>
            </div>
        </div>

        <p class="tagline">Cria a tua conta e organiza<br>o teu trabalho com <strong>IPVC Community</strong></p>

        <div class="carousel-dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Formulário à DIREITA -->
    <div class="right-panel">
        <h1>Cria a tua conta</h1>
        <p class="subtitle">Junta-te à <strong>IPVC Community</strong> e começa já.</p>

        <form id="register-form">
            <div class="form-group">
                <input type="text" id="name" placeholder="Nome" required />
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required />
            </div>
            <div class="form-group password-group">
                <input type="password" id="password" placeholder="Password (mín. 6)" required minlength="6" />
                <button type="button" class="toggle-password" onclick="togglePassword('password')"><i class="fa-solid fa-eye"></i></button>
            </div>

            <!-- ERROS -->
            <p id="error" class="error" style="color:#d33; margin:8px 0;" hidden></p>

            <button type="submit" class="login-btn">Registar</button>
        </form>

        <p class="register-link">Já tens conta? <a href="/login.html">Entrar</a></p>
    </div>
</div>

<script src="/register.js"></script>
</body>
</html>
