<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>IPVC Community - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1700px;
            margin: auto;
            background: transparent;
            border-radius: 20px;
            overflow: hidden;
            min-height: 850px;
        }

        .left-panel {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            background: transparent;
        }

        .left-panel h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
        }

        .left-panel .subtitle {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .left-panel .subtitle strong {
            color: #fff;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 18px 24px;
            border: 2px solid #131313;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: #303030;
            color: #fff;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .form-group input:focus {
            border-color: #000;
        }

        .password-group {
            position: relative;
        }

        .password-group input {
            padding-right: 60px;
        }

        .toggle-password {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #ccc;
            font-size: 1.2rem;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 2rem;
        }

        .forgot-password a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #e47a38;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .login-btn:hover {
            background: #e47a38;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .divider {
            text-align: center;
            position: relative;
            margin-bottom: 2rem;
            color: #ccc;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e5e5e5;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #000;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .register-link {
            text-align: center;
            color: #ccc;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #e47a38;
        }

        .right-panel {
            flex: 1;
            background: linear-gradient(135deg, #e47a38 0%, #e3bf9b 100%);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 15px;
        }

        .illustration {
            width: 100%;
            max-width: 450px;
            margin-bottom: 3rem;
        }

        .task-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            position: absolute;
            bottom: 100px;
            left: 60px;
        }

        .task-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
        }

        .task-info {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .task-tag {
            display: inline-block;
            padding: 6px 16px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .progress-circle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
        }

        .tagline {
            text-align: center;
            font-size: 1.3rem;
            color: #333;
            line-height: 1.6;
        }

        .tagline strong {
            font-weight: 700;
            color: #000;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 2rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #000;
            transition: all 0.3s;
        }

        .dot.active {
            width: 30px;
            border-radius: 5px;
            background: #000;
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
                margin: 16px auto 32;
                min-height: unset;
            }

            .right-panel {
                display: none;
            }

            .left-panel {
                justify-content: flex-start;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left-panel">
        <h1>IPVC Community</h1>
        <p class="subtitle">Join the Party with <strong>IPVC</strong></p>

        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required />
            </div>

            <div class="form-group password-group">
                <input type="password" id="password" placeholder="Password" required minlength="6" />
                <button type="button" class="toggle-password" onclick="togglePassword()"><i class="fa-solid fa-eye"></i></button>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <!-- elemento para mensagens de erro -->
            <p id="error" class="error" style="color:#d33; margin-bottom:1rem;" hidden></p>

            <button type="submit" class="login-btn">Login</button>
        </form>
